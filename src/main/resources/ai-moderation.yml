# Optional OpenAI chat moderation. Chat always fails open if this subsystem is unavailable.
enabled: false
shadow-mode: true

# Message blocking/deletion and punishment escalation are separate rollout controls.
# Set shadow-mode: false to enforce message decisions while keeping punishments disabled.
punishments:
  enabled: false

# Use the currently supported moderation alias. We observed HTTP 403 for the pinned
# omni-moderation-2024-09-26 snapshot while this alias succeeds for the same project/key.
model: omni-moderation-latest

# Put the OpenAI API key here if you do not want to configure an environment variable.
# Keep this file private and never commit a real key to GitHub.
api-key: ''

# Optional fallback. Used only when api-key above is blank.
api-key-environment-variable: OPENAI_API_KEY
maximum-chat-hold-ms: 200
request-timeout-ms: 2000

context:
  before-messages: 6
  after-messages: 3
  max-age-seconds: 45
  max-characters: 3500
  follow-up-delay-ms: 1500

circuit-breaker:
  failures-to-open: 3
  open-seconds: 60

# These values stay locked to the EnthusiaStaff automatic-mute contract for when punishments are enabled.
# While punishments.enabled is false, DELETE decisions still block/remove messages but do not record strikes or request mutes.
strikes:
  required: 2
  window-minutes: 60
  mute-days: 30

policy:
  corroboration-floor-ratio: 0.75
  # Plain harassment is intentionally conservative for Minecraft chat. Unlike the
  # higher-risk categories below, surrounding context cannot promote this category
  # into a DELETE decision; the message itself must clear this threshold.
  harassment: 0.97
  harassment-threatening: 0.78
  hate: 0.82
  hate-threatening: 0.70
  # Slightly lower so abusive shorthand such as KYS crosses the instruction threshold.
  self-harm-instructions: 0.75
  sexual-minors: 0.65
  violence-graphic: 0.92
  illicit-violent: 0.92
  # Higher than the first rollout to avoid Minecraft phrases such as "kill me bro"
  # while still surfacing strong first-person self-harm intent for staff review.
  self-harm-intent-alert: 0.85

# Dedicated permission for AI moderation staff notices. Do not grant this to normal players.
staff-status-permission: rosechat.ai.alerts
