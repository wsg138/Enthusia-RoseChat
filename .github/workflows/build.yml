name: Build

on:
  push:
    branches:
      - master
      - section/staff-bridge-api
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: rosechat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out RoseChat
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check out the compile-only LumaGuilds API
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wsg138/LumaGuilds
          ref: 70bc6d055b22d1f824edd89ef57280f457c998fc
          path: .dependencies/LumaGuilds

      - name: Supply RoseChat to the LumaGuilds build
        shell: bash
        run: |
          mkdir -p .dependencies/LumaGuilds/libs
          curl --fail --location --retry 3 \
            https://github.com/BadgersMC/Enthusia-RoseChat/releases/download/RC-2/RoseChat-RC-2.jar \
            --output .dependencies/LumaGuilds/libs/RoseChat-RC-2.jar
          echo '0558a2d4ca942883534fc87f536dadbeb7702d3c79bcec17a1c2b7939d286f5d  .dependencies/LumaGuilds/libs/RoseChat-RC-2.jar' \
            | sha256sum --check --strict

      - name: Build the LumaGuilds dependency
        shell: bash
        run: .dependencies/LumaGuilds/gradlew -p .dependencies/LumaGuilds --no-daemon shadowJar -x test

      - name: Locate the LumaGuilds jar
        shell: bash
        run: |
          jar_path=$(find .dependencies/LumaGuilds/build/libs -maxdepth 1 -type f \
            -name 'LumaGuilds-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          if [[ -z "$jar_path" ]]; then
            echo "LumaGuilds did not produce a usable jar" >&2
            exit 1
          fi
          echo "LUMAGUILDS_JAR=$GITHUB_WORKSPACE/$jar_path" >> "$GITHUB_ENV"

      - name: Build and test RoseChat
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test shadowJar

      - name: Verify test execution
        shell: python
        run: |
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          reports = list(pathlib.Path('build/test-results/test').glob('TEST-*.xml'))
          totals = {'tests': 0, 'skipped': 0, 'failures': 0, 'errors': 0}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))
          print(totals)
          if not reports or totals['tests'] < 10 or any(totals[key] for key in ('skipped', 'failures', 'errors')):
              sys.exit('Expected all ten staff bridge tests to execute and pass')

      - name: Verify provider packaging
        shell: bash
        run: |
          jar_path=$(find build/libs -maxdepth 1 -type f -name 'RoseChat-*.jar' | head -n 1)
          jar tf "$jar_path" > jar-entries.txt
          api_count=$(grep -c '^dev/rosewood/rosechat/api/staff/.*\.class$' jar-entries.txt)
          if [[ "$api_count" -ne 15 ]]; then
            echo "Expected 15 staff API class entries, found $api_count" >&2
            exit 1
          fi
          if grep -Eq '^(net/enthusia/staff|org/bukkit|net/lumalyte/lg)/' jar-entries.txt; then
            echo "The provider jar contains a consumer or server API class" >&2
            exit 1
          fi

      - name: Upload RoseChat jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RoseChat
          path: build/libs/RoseChat-*.jar
          if-no-files-found: error
