import org.apache.tools.ant.filters.ReplaceTokens

buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:8.3.5'
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
}

apply plugin: 'com.gradleup.shadow'

group = 'dev.rosewood'
version = 'RC-3'

def lumaGuildsJar = file(System.getenv('LUMAGUILDS_JAR') ?: 'libs/LumaGuilds-2.1.0.jar')

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
    disableAutoTargetJvm()
}

sourceSets {
    lumaGuildsApi {
        java.srcDir 'src/lumaGuildsApi/java'
    }
}

compileJava {
    options.compilerArgs += ['-parameters']
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()

    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.rosewooddev.io/repository/public/' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://nexus.scarsz.me/content/groups/public/' }
    maven { url = 'https://m2.dv8tion.net/releases' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }

    maven { url = 'https://repo.glaremasters.me/repository/towny/' }
    maven { url = 'https://nexus.neetgames.com/repository/maven-releases/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://repo.roinujnosde.me/releases/' }
    maven { url = 'https://ci.ender.zone/plugin/repository/everything/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public/' }
    maven { url = 'https://repo.bg-software.com/repository/api/' }
    maven { url = 'https://nexus.iridiumdevelopment.net/repository/maven-releases/' }
    maven { url = 'https://repo.pcgamingfreaks.at/repository/maven-everything/' }
    maven { url = 'https://repo.essentialsx.net/releases/' }
    maven { url = 'https://repo.william278.net/releases' }
}

dependencies {
    api 'dev.rosewood:rosegarden:1.5.4'
    api 'org.apache.commons:commons-text:1.12.0'

    compileOnly 'net.kyori:adventure-api:4.25.0'
    compileOnly 'net.md-5:bungeecord-chat:1.21-R0.5-20251216.193400-13'
    compileOnly 'net.md-5:bungeecord-api:1.21-R0.5-20251216.193400-13'
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT', {
        exclude group: 'net.md-5'
    }
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.github.milkbowl:vault:1.7.3'
    compileOnly 'com.discordsrv:discordsrv:1.27.0'
    compileOnly 'net.dv8tion:JDA:4.3.0_349'
    compileOnly 'com.comphenix.protocol:ProtocolLib:5.0.0-SNAPSHOT'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'com.palmergames.bukkit.towny:towny:0.99.6.0'
    compileOnly 'com.gmail.nossr50.mcMMO:mcMMO:2.1.206'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.12'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.3.12'
    compileOnly 'net.sacredlabyrinth.phaed.simpleclans:SimpleClans:2.19.2'
    compileOnly 'com.massivecraft:Factions:1.6.9.5-U0.7.5'
    compileOnly 'org.kingdoms:kingdoms:1.16.10.0.2-BETA'
    compileOnly 'world.bentobox:bentobox:2.7.0-SNAPSHOT'
    compileOnly 'com.bgsoftware:SuperiorSkyblockAPI:1.11.1'
    compileOnly 'com.iridium:IridiumSkyblock:3.2.10'
    compileOnly 'com.songoda:FabledSkyBlock:3.0.0'
    compileOnly 'at.pcgamingfreaks:MarriageMaster-API:2.7.5'
    compileOnly 'com.loohp:InteractiveChat:4.2.17.0'
    compileOnly 'net.william278:HuskTowns:3.0.6'
    compileOnly 'org.jetbrains:annotations:24.1.0'

    compileOnly 'net.essentialsx:EssentialsX:2.20.1'
    compileOnly 'net.essentialsx:EssentialsXChat:2.20.1'

    compileOnly files(lumaGuildsJar)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('compileLumaGuildsApiJava') {
    enabled = !lumaGuildsJar.exists()
}

tasks.named('compileJava') {
    if (lumaGuildsJar.exists()) {
        classpath += files(lumaGuildsJar)
    } else {
        classpath += sourceSets.lumaGuildsApi.output
    }
}

processResources {
    filter ReplaceTokens, tokens: [version: version]
}

shadowJar {
    archiveClassifier.set('')
    relocate 'org.bstats', 'dev.rosewood.rosechat.lib.bstats'
    relocate 'org.apache.commons.text', 'dev.rosewood.rosechat.lib.apache.commons.text'
}

jar {
    enabled = false
}

publishing {
    publications {
        shadow(MavenPublication) {
            artifact shadowJar
            groupId = project.group
            artifactId = 'rosechat'
            version = project.version
        }
    }
}
